[project]
name = "offline-assistant"
version = "0.1.0"
description = "lightweight android offline assistant"
readme = "README.md"
authors = [
    { name = "lioanys", email = "lopezgarcialioanys@gmail.com" }
]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
needle = ["cactus-needle==2.0.12"]
voice = ["vosk==0.3.45"]

[dependency-groups]
dev = [
	"pytest",
]

[project.scripts]
offline-assistant = "offline_assistant.main:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["offline_assistant", "assistant", "platform_api", "tools"]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
